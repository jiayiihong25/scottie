# config/models.yaml — task type -> OmniRoute alias.
#
# Aliases must already exist in OmniRoute's own /api/models/alias config
# (Railway deploy). This file only says which alias each task type asks
# for; swapping the physical model behind an alias happens in OmniRoute's
# dashboard, not here — see docs/orchestration-design.md.

# Custom combos, not OmniRoute's built-in auto/* routers: auto/best-free
# only picks models it tags "free" (just the Felo web providers, which
# 400/429 constantly), and auto/* choices can change on their own. Both
# combos are Gemini 3 Flash first, then the Felo providers as fallback.
concept_agent: scottie-concept  # needs to write a decent question
card_agent: scottie-cards       # flashcards are short, mechanical
